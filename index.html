:root{--f-blk:'NLS FiraXC','Fira Sans Extra Condensed','Arial Narrow',Arial,sans-serif;--f-myr:'NLS Source','Source Sans 3','Segoe UI',Arial,sans-serif;--f-cal:'NLS Carlito',Carlito,Calibri,Arial,sans-serif;--f-ant:'NLS Anton',Anton,Impact,'Arial Narrow',sans-serif;--f-rob:'NLS RobotoCond','Roboto Condensed','Arial Narrow',Arial,sans-serif;--f-ar:'NLS Arimo',Arimo,Arial,Helvetica,sans-serif;--f-hi:'NLS Devanagari','Noto Sans Devanagari','Nirmala UI',Mangal,'Kohinoor Devanagari',sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f2f4f6;color:#222}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app-shell{max-width:1600px;margin:0 auto;padding:18px;display:grid;grid-template-columns:minmax(300px,470px) minmax(520px,1fr);gap:18px;align-items:start}
.editor{background:#fff;border:1px solid #d8dde3;border-radius:12px;box-shadow:0 3px 14px rgba(0,0,0,.06);overflow:hidden;position:sticky;top:12px;max-height:calc(100vh - 24px);display:flex;flex-direction:column}
.editor-head{padding:18px 18px 12px;border-bottom:1px solid #e5e7eb}
.brandline{display:flex;align-items:center;gap:10px}
.brandmark{width:34px;height:34px;border:2px solid #222;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:12px}
.editor-head h1{font-size:20px;margin:0;line-height:1.2}
.editor-head p{margin:7px 0 0;color:#667085;font-size:12px;line-height:1.45}
.toolbar{display:flex;flex-wrap:wrap;gap:7px;padding:12px 16px;border-bottom:1px solid #e5e7eb}
.btn{border:1px solid #cbd5e1;border-radius:7px;padding:8px 11px;background:#fff;color:#222;font-size:12px;font-weight:700}
.btn.primary{background:#222;color:#fff;border-color:#222}
.btn.soft{background:#f3f4f6}
.btn.danger{color:#9b1c1c;border-color:#e2b6b6}
.btn:hover{filter:brightness(.96)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.themebar{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:10px 16px;border-bottom:1px solid #e5e7eb;background:#fafbfc}
.themebar>span{font-size:11px;font-weight:800;color:#4b5563;margin-right:2px}
.theme-btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid #cbd5e1;border-radius:20px;padding:4px 10px 4px 5px;background:#fff;font-size:11px;font-weight:700;color:#333}
.theme-btn .sw{display:inline-flex;width:20px;height:14px;border-radius:7px;overflow:hidden;border:1px solid rgba(0,0,0,.25)}
.theme-btn .sw i{flex:1;display:block}
.theme-btn.active{border-color:#111;box-shadow:0 0 0 2px rgba(0,0,0,.1)}
.tabs{display:flex;gap:3px;padding:0 12px;border-bottom:1px solid #e5e7eb;overflow-x:auto}
.tab{border:0;background:transparent;padding:12px 10px 11px;font-size:12px;font-weight:700;color:#667085;border-bottom:3px solid transparent;white-space:nowrap}
.tab.active{color:#111;border-bottom-color:#222}
.editor-body{padding:14px 16px 22px;overflow:auto}
.section-title{font-size:15px;margin:4px 0 12px;font-weight:800}
.help{font-size:11px;color:#667085;line-height:1.45;margin:-5px 0 12px}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:11px;font-weight:700;color:#4b5563}
.field input,.field textarea,.field select{width:100%;border:1px solid #cbd5e1;border-radius:6px;padding:8px 9px;background:#fff;color:#222;font-size:12px;min-width:0}
.field textarea{min-height:64px;resize:vertical;line-height:1.4}
.field input[type=file]{padding:6px;font-size:11px}
.card-edit{border:1px solid #e1e5ea;border-radius:9px;padding:12px;margin:10px 0;background:#fbfcfd}
.card-edit-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.card-edit-head strong{font-size:12px}
.card-edit .btn{padding:5px 8px;font-size:10px}
.photo-edit-preview{width:52px;height:58px;border:1px solid #bbb;border-radius:5px;object-fit:cover;background:#eee;display:block;margin-top:6px}
.actions-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
.day-edit{border:1px solid #e1e5ea;border-radius:9px;margin:12px 0;overflow:hidden}
.day-edit-head{background:#f3f4f6;padding:10px 12px;font-weight:800;font-size:12px}
.day-edit-body{padding:12px}
.row-edit{padding:10px;border:1px solid #e5e7eb;border-radius:7px;margin:8px 0;background:#fff}
.row-edit-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:11px;font-weight:700}
.note-chip{font-size:10px;background:#ececec;border-radius:20px;padding:3px 7px;color:#444}
/* tracker editor */
.col-edit{display:grid;grid-template-columns:1fr auto;gap:6px 8px;align-items:center;border:1px solid #e1e5ea;border-radius:8px;padding:8px 9px;margin:7px 0;background:#fff}
.col-edit .col-meta{grid-column:1/-1;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:#333}
.col-edit .col-meta .grow{flex:1}
.type-chip{font-size:10px;border-radius:20px;padding:2px 8px;font-weight:800}
.type-chip.d{background:#e8eef7;color:#274b7a}.type-chip.w{background:#efe6f7;color:#59307f}
.col-edit input{width:100%;border:1px solid #cbd5e1;border-radius:6px;padding:7px 8px;font-size:12px;grid-column:1/-1}
.mini{border:1px solid #cbd5e1;background:#fff;border-radius:6px;padding:3px 7px;font-size:11px;font-weight:800;line-height:1.2}
.mini.danger{color:#9b1c1c;border-color:#e2b6b6}
.stepper{display:flex;gap:6px;align-items:center}
.stepper input{width:70px;text-align:center}
.warn{border:1px solid #f0c36d;background:#fff8e6;color:#7a4b00;border-radius:8px;padding:9px 11px;font-size:11.5px;line-height:1.45;margin:8px 0 12px}
.info{border:1px solid #cfe0f2;background:#f3f8fe;color:#27456b;border-radius:8px;padding:8px 11px;font-size:11.5px;line-height:1.45;margin:8px 0 12px}
.preview-wrap{min-width:0}
.preview-head{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;color:#475467;font-size:12px;gap:10px;flex-wrap:wrap}
.preview-head strong{color:#111;font-size:14px}
.preview-warn{margin:0 0 10px}
.print-pages{display:flex;flex-direction:column;gap:18px;align-items:center;padding:6px 0 40px}
.print-page{width:210mm;height:297mm;background:#fff!important;box-shadow:0 3px 15px rgba(0,0,0,.16);position:relative;overflow:hidden;color:var(--ink);flex:none}
.empty-photo{display:flex;align-items:center;justify-content:center;color:#888;background:#eee;border:1px dashed #aaa;text-align:center;font-size:8pt;font-weight:600}

/* ============ THEMES (paper is always white; themes only recolour the design) ============ */

.print-pages[data-theme=slate]{--ink:#14202e;--title-ink:#1c3550;--head-bg:#34506f;--ribbon-bg:#263f5c;--band:#e2e9f1;--note-bg:#263f5c;--bar:#1f3a56;--pill-bg:#cbd9e8;--pill-line:#1f3a56;--pill-ink:#14263a;--frame:#1f3a56;--line:#1f3550;--group-line:#34506f;--footer-bg:#e2e9f1;--footer-shadow:#1f3a56;--footer-line:#1f3a56;--icon-bg:#1f3a56;--brace:#bccde0;--photo-line:#1f3a56;--photo-bg:#cbd9e8;--page-bar:#1f3a56;--rule:#1f3a56;--trk-line:#1f3550;--trk-frame:#8aa0b8;--trk-tint:#eef3f9;--trk-title:#1c3550;--trk-label:#14263a}
.print-pages[data-theme=forest]{--ink:#14261b;--title-ink:#1f4530;--head-bg:#3d6b4f;--ribbon-bg:#2b5239;--band:#e3eee6;--note-bg:#2b5239;--bar:#1f4530;--pill-bg:#cde3d3;--pill-line:#1f4530;--pill-ink:#14301f;--frame:#1f4530;--line:#1f3f2b;--group-line:#3d6b4f;--footer-bg:#e3eee6;--footer-shadow:#1f4530;--footer-line:#1f4530;--icon-bg:#1f4530;--brace:#bcd6c4;--photo-line:#1f4530;--photo-bg:#cde3d3;--page-bar:#1f4530;--rule:#1f4530;--trk-line:#1f3f2b;--trk-frame:#8fb09b;--trk-tint:#eef6f0;--trk-title:#1f4530;--trk-label:#14301f}

/* ============ PAGE 1 – POSTER (coordinates are PDF points taken from the original) ============ */
.poster-page .abs{position:absolute}
.poster-page::before{content:"";position:absolute;left:12.2pt;right:12.4pt;top:12.2pt;bottom:12.2pt;border:4pt solid var(--frame);pointer-events:none;z-index:5}
.poster-page::after{content:"";position:absolute;left:20.4pt;right:20.7pt;top:20.4pt;bottom:20.5pt;border:1.5pt solid var(--frame);pointer-events:none;z-index:5}
.p-caption{left:39pt;top:54.9pt;font:900 22.6pt/24.4pt var(--f-blk);white-space:nowrap;color:var(--ink)}
.p-logo{left:379pt;top:17pt;width:180pt;height:auto;display:block}
.p-title{left:0;top:121pt;width:595.28pt;height:100pt;display:flex;justify-content:center;align-items:flex-start;gap:7pt;color:var(--ink)}
.p-title .num{letter-spacing:3pt;font:400 80pt/1 var(--f-ant);display:flex;align-items:flex-start;white-space:nowrap;margin-top:0}
.p-title .num sup{font:400 37pt/1 var(--f-ant);letter-spacing:0;vertical-align:baseline;position:relative;top:0;margin-left:2pt}
.p-title .ttl{display:flex;flex-direction:column;align-items:flex-start;white-space:nowrap;margin-top:6pt}
.p-title .ttl .ev{font:400 29.6pt/1.15 var(--f-ant)}
.p-title .ttl .ct{font:400 52.3pt/1.0 var(--f-ant);margin-top:-1pt}
.p-card{width:170pt;text-align:center;font:900 10.9pt/10.9pt var(--f-blk);color:var(--ink)}
.p-card .ph,.p-card .empty-photo{width:75pt;height:90pt;margin:0 auto 5.6pt;border:.57pt solid var(--photo-line);border-radius:9pt;background:var(--photo-bg);object-fit:cover;object-position:50% 22%;display:block;padding:0}
.p-card .empty-photo{display:flex}
.p-pill{left:157.2pt;top:223.7pt;min-width:280.5pt;height:34pt;padding:0 12pt;border:.57pt solid var(--pill-line);border-radius:17pt;background:var(--pill-bg);color:var(--pill-ink);font:900 28pt/33pt var(--f-blk);text-align:center;white-space:nowrap}
.p-tag{left:0;top:268.3pt;width:595.28pt;text-align:center;font:900 28.2pt/25.9pt var(--f-blk);color:var(--ink)}
.p-kw{left:0;top:300pt;width:595.28pt;height:52pt;display:flex;justify-content:center;align-items:center;gap:6pt;color:var(--ink)}
.p-kw .lines{font:700 21.1pt/21.1pt var(--f-myr);text-align:center;white-space:nowrap}
.p-kw .braces{font:400 54pt/1 var(--f-myr);color:var(--brace);position:relative;top:-2pt}
.p-people{left:35.6pt;top:365.5pt;width:523.7pt;height:351.3pt;display:flex;flex-direction:column;gap:6.4pt}
.people-group{border:.57pt solid var(--group-line);display:flex;flex-direction:column;min-height:0;overflow:hidden;flex:none}
.people-heading{height:24.8pt;background:var(--bar);color:var(--bar-ink);display:flex;align-items:center;justify-content:center;font:700 18pt/1 var(--f-cal);flex:none;margin:-.57pt -.57pt 0}
.people-rows{display:flex;flex-direction:column;justify-content:space-evenly;flex:1;min-height:0;padding:0 10pt}
.people-row{display:flex;justify-content:center;align-items:flex-start;gap:var(--gap,12pt)}
.person-card{display:flex;flex-direction:column;align-items:center;width:var(--pw,49pt);flex:none;gap:3.3pt}
.person-photo,.person-placeholder{width:var(--pw,49pt);height:calc(var(--pw,49pt) * 1.163);object-fit:cover;object-position:50% 22%;border:.57pt solid var(--photo-line);border-radius:3pt;background:#eee;display:block;flex:none}
.person-placeholder{display:flex;align-items:center;justify-content:center;font:700 7pt var(--f-cal);color:#777}
.person-name{font:700 6.5pt/7.5pt var(--f-rob);text-align:center;white-space:nowrap;width:calc(var(--pw,49pt) + var(--gap,12pt) - 1pt);flex:none;color:var(--ink)}
.person-name.wrap{white-space:normal}
.p-footer{left:33.4pt;top:723.3pt;width:523.7pt;height:86.2pt;background:var(--footer-bg);box-shadow:4.3pt 4pt 0 var(--footer-shadow);color:var(--ink)}
.p-footer .details{position:absolute;left:22.6pt;top:8.4pt;font:700 12pt/13.6pt var(--f-cal);white-space:nowrap}
.p-footer .details .em{font-family:var(--f-myr);font-weight:700;font-size:12pt}
.p-footer .details .rg{font-family:var(--f-myr);font-weight:400;font-size:12pt}
.p-footer .vline{position:absolute;left:349.2pt;top:12.7pt;height:60.8pt;border-left:.57pt solid var(--footer-line)}
.p-footer .socials{position:absolute;left:357pt;top:7pt;display:flex;flex-direction:column;gap:5.6pt}
.social-item{display:flex;align-items:center;height:18.6pt;font:700 12.4pt/1 var(--f-cal);font-style:italic;white-space:nowrap}
.social-item svg{width:18.6pt;height:18.6pt;margin-right:10pt;flex:none;display:block}

/* ============ MODERN EDITOR SKIN ============ */
body{background:#eef1f6;font-family:Inter,'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif}
.app-shell{grid-template-columns:minmax(340px,500px) minmax(520px,1fr);gap:20px}

.editor-head{padding:18px 20px 14px;background:linear-gradient(135deg,#1e293b,#334155);color:#fff;border:0}
.editor-head h1{color:#fff;font-size:19px;letter-spacing:-.01em}
.editor-head p{color:#cbd5e1;font-size:11.5px}
.brandmark{border-color:#fff;color:#fff;background:rgba(255,255,255,.08)}
.editor-head div[style]{color:#94a3b8!important}
.toolbar{gap:8px;padding:12px 16px;background:#f8fafc}
.btn{border-radius:10px;border:1px solid #dbe2ea;padding:8px 12px;font-weight:650;transition:.15s;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.btn:hover{filter:none;background:#f1f5f9;transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,#4f46e5,#6366f1);border-color:#4f46e5;box-shadow:0 4px 12px rgba(79,70,229,.35);margin-left:auto}
.btn.primary:hover{background:linear-gradient(135deg,#4338ca,#4f46e5)}
.btn.danger:hover{background:#fef2f2}
.themebar{display:block;padding:12px 16px;background:#fff}
.themebar .th-head{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:800;color:#475569;margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em}
.themebar .th-head b{color:#111;text-transform:none;letter-spacing:0;font-size:12px}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:7px}
.theme-sw{position:relative;aspect-ratio:1;border-radius:11px;border:2px solid #fff;box-shadow:0 0 0 1px #d5dbe3;overflow:hidden;padding:0;display:flex;background:none;transition:.15s}
.theme-sw i{flex:1}
.theme-sw:hover{transform:translateY(-2px) scale(1.05);box-shadow:0 0 0 1px #94a3b8,0 6px 12px rgba(0,0,0,.15)}
.theme-sw.active{box-shadow:0 0 0 2.5px #4f46e5,0 4px 10px rgba(79,70,229,.3)}
.theme-sw.active::after{content:"\2713";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:900;font-size:15px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.tabs{padding:8px 12px;gap:6px;border-bottom:1px solid #e8edf3;background:#fff}
.tab{border-radius:10px;padding:8px 12px;border:0;font-size:12px;color:#64748b}
.tab:hover{background:#f1f5f9}
.tab.active{background:#eef2ff;color:#4338ca;border:0}
.editor-body{padding:16px 18px 26px;background:#fbfcfe}
.section-title{font-size:15px;letter-spacing:-.01em;color:#0f172a;display:flex;align-items:center;gap:8px}
.section-title::before{content:"";width:4px;height:16px;border-radius:3px;background:#6366f1}
.help{color:#64748b}
.field label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#64748b;font-weight:750}
.field input,.field textarea,.field select,.col-edit input{border:1.5px solid #e2e8f0;border-radius:10px;padding:9px 11px;background:#fff;transition:.15s}
.field input:focus,.field textarea:focus,.col-edit input:focus{outline:0;border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.card-edit,.row-edit,.col-edit{border:1px solid #e8edf3;border-radius:14px;background:#fff;box-shadow:0 1px 3px rgba(15,23,42,.04)}
.card-edit-head strong{color:#0f172a}
details.day-edit{border:1px solid #e8edf3;border-radius:14px;margin:10px 0;background:#fff;overflow:hidden;box-shadow:0 1px 3px rgba(15,23,42,.04)}
details.day-edit>summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:800;font-size:12.5px;background:#f8fafc;display:flex;align-items:center;gap:8px}
details.day-edit>summary::-webkit-details-marker{display:none}
details.day-edit>summary::before{content:"\25B8";color:#6366f1;transition:.15s}
details.day-edit[open]>summary::before{transform:rotate(90deg)}
details.day-edit>summary .cnt{margin-left:auto;font-size:10px;font-weight:700;background:#e0e7ff;color:#3730a3;border-radius:20px;padding:2px 8px}
.warn{border-radius:12px}.info{border-radius:12px}
.mini{border-radius:8px}
.preview-head{background:#fff;border-radius:14px;padding:12px 16px;box-shadow:0 2px 8px rgba(15,23,42,.06);margin-bottom:14px}
.type-chip{font-weight:750}
@media(max-width:1050px){.app-shell{grid-template-columns:1fr}}

/* ============ V5 UI: top bar + app layout ============ */
:root{--top-h:62px}
body{background:radial-gradient(1100px 520px at 8% -8%,#e0e7ff 0%,transparent 60%),radial-gradient(900px 480px at 100% 0%,#fce7f3 0%,transparent 55%),#f4f6fb;min-height:100vh;background-attachment:fixed}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px 18px;flex-wrap:wrap;padding:10px 22px;background:linear-gradient(135deg,#0f172a 0%,#1e1b4b 60%,#312e81 100%);color:#fff;box-shadow:0 8px 28px rgba(15,23,42,.35)}
.topbar .brand{display:flex;gap:12px;align-items:center}
.topbar .brandmark{width:38px;height:38px;border:2px solid rgba(255,255,255,.85);color:#fff;background:rgba(255,255,255,.08);font-size:12px;letter-spacing:.02em}
.topbar h1{margin:0;font-size:17px;letter-spacing:-.01em;color:#fff;line-height:1.15}
.topbar small{display:block;font-size:9.5px;letter-spacing:.16em;color:#a5b4fc;font-weight:800;text-transform:uppercase;margin-top:2px}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.topbar .btn{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:11px;padding:8px 13px}
.topbar .btn:hover{background:rgba(255,255,255,.18);transform:translateY(-1px)}
.topbar .btn.primary{background:linear-gradient(135deg,#6366f1,#ec4899);border:0;box-shadow:0 6px 20px rgba(236,72,153,.4);margin-left:0;padding:9px 17px}
.topbar .btn.primary:hover{filter:brightness(1.08)}
.theme-pop{position:relative}
.theme-trigger{display:inline-flex;align-items:center;gap:8px}
.theme-trigger .sw,.theme-trigger #themeTriggerSw{display:inline-flex;width:22px;height:16px;border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,.55)}
.theme-trigger .sw i,#themeTriggerSw i{flex:1;display:block}
.theme-panel{position:absolute;right:0;top:calc(100% + 12px);width:420px;max-width:92vw;background:#fff;color:#0f172a;border-radius:18px;box-shadow:0 24px 60px rgba(15,23,42,.4);padding:16px;z-index:60;max-height:78vh;overflow:auto}
.theme-panel[hidden]{display:none}
.th-head{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}
.th-head b{color:#4338ca;text-transform:none;letter-spacing:0;font-size:12.5px}
.theme-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.theme-card{border:1.5px solid #e2e8f0;border-radius:13px;background:#fff;padding:8px;text-align:left;display:flex;flex-direction:column;gap:7px;font-size:11px;font-weight:700;color:#334155;transition:.15s}
.theme-card .bars{display:flex;height:26px;border-radius:8px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.theme-card .bars i{flex:1}
.theme-card:hover{border-color:#a5b4fc;transform:translateY(-2px);box-shadow:0 8px 18px rgba(79,70,229,.15)}
.theme-card.active{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.22);background:#f5f7ff}
.th-note{font-size:10.5px;color:#94a3b8;margin:10px 0 0}
.app-shell{max-width:1700px;padding:18px 22px 30px;grid-template-columns:minmax(360px,490px) minmax(0,1fr);gap:22px;align-items:start}
.editor{position:sticky;top:calc(var(--top-h) + 16px);height:calc(100vh - var(--top-h) - 34px);max-height:none;display:flex;flex-direction:column;overflow:hidden;border-radius:20px;border:1px solid rgba(148,163,184,.25);background:#fff;box-shadow:0 14px 40px rgba(30,41,59,.12)}
.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px;background:#f1f5f9;border-bottom:1px solid #e2e8f0;overflow:visible}

.tab svg{flex:none}
.tab:hover{background:#e8edf5;color:#334155}
.tab.active{background:#fff;color:#4338ca;box-shadow:0 4px 12px rgba(67,56,202,.16),0 0 0 1px rgba(99,102,241,.2)}
.editor-body{flex:1;min-height:0;overflow:auto;padding:18px 18px 28px;background:#fbfcfe;scrollbar-width:thin;scrollbar-color:#c7d2fe transparent}
.editor-body::-webkit-scrollbar{width:9px}.editor-body::-webkit-scrollbar-thumb{background:#c7d2fe;border-radius:9px}

.preview-head{position:sticky;top:calc(var(--top-h) + 10px);z-index:20;display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border:1px solid rgba(148,163,184,.25);border-radius:16px;padding:10px 14px;box-shadow:0 6px 20px rgba(15,23,42,.08);margin:0 0 16px}
.preview-head .ph-left{display:flex;flex-direction:column;gap:2px;margin-right:auto}
.preview-head strong{font-size:14px;color:#0f172a}
.preview-head .ph-left span{font-size:11px;color:#64748b}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid #e2e8f0;background:#fff;color:#334155;border-radius:20px;padding:5px 11px;font-size:11px;font-weight:750;transition:.15s}
.chip:hover{background:#eef2ff;border-color:#a5b4fc;color:#4338ca}
.zoom{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:750;color:#64748b}
.zoom select{border:1px solid #e2e8f0;border-radius:10px;padding:5px 8px;background:#fff;font-size:11.5px}
.print-pages{gap:22px;padding:4px 0 10px}
.print-page{border-radius:2px;box-shadow:0 2px 4px rgba(15,23,42,.08),0 16px 40px rgba(15,23,42,.18)}
.print-tip{text-align:center;color:#94a3b8;font-size:11px;margin:6px 0 24px}
@media(max-width:1050px){

 .app-shell{grid-template-columns:1fr;padding:12px}
 .editor{position:relative;top:auto;height:auto;max-height:none;overflow:visible}

/* ---------- tracker layout model (shared by the editor and the page) ---------- */
const TK={W:437.2,DAYW:28.6,BODY_H:715,LABEL_H:77,WEEK_RATIO:3.23,MIN_COL:15};
function trackerLayout(){
 const t=state.tracker,cols=t.columns,days=clampDays(t.days);
 const nd=cols.filter(c=>c.type!=='w').length,nw=cols.length-nd;
 const units=nd+nw*TK.WEEK_RATIO;
 const d=units?(TK.W-TK.DAYW)/units:0;
 const rowH=Math.min(40,TK.BODY_H/days);
 return {days,nd,nw,d,w:d*TK.WEEK_RATIO,rowH,narrow:units>0&&d<TK.MIN_COL,tooManyDays:days>31};
}
function trackerWarnings(){
 const L=trackerLayout(),out=[];
 if(L.narrow)out.push(`With ${L.nd+L.nw} columns each daily column is only ${(L.d*0.3528).toFixed(1)} mm wide. Labels are being shrunk to fit; remove a column or shorten labels for comfortable reading.`);
 if(L.days>31)out.push(`${L.days} day rows: rows are only ${(L.rowH*0.3528).toFixed(1)} mm tall, so day numbers and writing space are small.`);
 if(L.days>=45)out.push('That many rows may be hard to fill in by hand.');
 return out;
}

function dateRange(){

 if(isNaN(start.getTime()))return '';
 if(isNaN(end.getTime()))end=new Date(start);
 if(start.getFullYear()===end.getFullYear() && start.getMonth()===end.getMonth()){
  if(start.getDate()===end.getDate())return `${start.getDate()} ${MONTHS[end.getMonth()]} ${end.getFullYear()}`;
  return `${start.getDate()}-${end.getDate()} ${MONTHS[end.getMonth()]} ${end.getFullYear()}`;
 }

 return fmt(start)+' - '+fmt(end);

function groupRows(list){
 const n=list.length;if(!n)return [];
 const MAXROW=10;
 if(state.rowMode==='balanced'){
  const rows=Math.ceil(n/MAXROW),base=Math.floor(n/rows),extra=n%rows;let out=[],offset=0;
  for(let i=0;i<rows;i++){const count=base+(i<extra?1:0);out.push(list.slice(offset,offset+count));offset+=count;}
  return out;
 }
 const out=[];for(let i=0;i<n;i+=MAXROW)out.push(list.slice(i,i+MAXROW));   // fill 10 per row, remainder on the last row

}

/* Sizes mentor/team photos so every photo in a group is identical, rows are centred and the two groups fill
   the area exactly like the original poster (max photo 49.5pt wide, min gap 9pt). All values in PDF points. */
function fitPoster(){
 const page=$('.poster-page');if(!page)return;
 const area=page.querySelector('.p-people');if(!area)return;
 const PX=96/72,W=523.7,SIDE=10,GAPMIN=9,GAPMAX=12.3,MAXW=49.5,RATIO=1.163,HEAD=24.8,NAMEH=10.8,PADMIN=5.7,GAP=6.4,EMPTY=44;
 const groups=[...area.querySelectorAll('.people-group')];
 const Havail=area.clientHeight/PX-GAP*(groups.length-1);
 const info=groups.map(g=>{const r=+g.dataset.rows||0,n=+g.dataset.cols||0;
  const pw0=n?Math.min(MAXW,(W-2*SIDE-(n-1)*GAPMIN)/n):MAXW;return {g,r,n,pw0};});
 const fixed=info.reduce((t,x)=>t+(x.r?HEAD+x.r*NAMEH+(x.r+1)*PADMIN:EMPTY),0);
 const vary=info.reduce((t,x)=>t+x.r*RATIO*x.pw0,0);
 const s=vary?Math.max(.35,Math.min(1,(Havail-fixed)/vary)):1;
 const need=info.map(x=>x.r?HEAD+x.r*(RATIO*x.pw0*s+NAMEH)+(x.r+1)*PADMIN:EMPTY);
 const left=Math.max(0,Havail-need.reduce((a,b)=>a+b,0));
 const share=info.reduce((t,x)=>t+(x.r?x.r+1:0),0)||1;
 info.forEach((x,i)=>{
  const pw=x.pw0*s,gap=x.n>1?Math.max(GAPMIN,Math.min(GAPMAX,(W-2*SIDE-x.n*pw)/(x.n-1))):GAPMAX;
  const h=need[i]+(x.r?left*(x.r+1)/share:Math.max(0,left-left));
  x.g.style.height=h.toFixed(2)+'pt';
  x.g.style.setProperty('--pw',pw.toFixed(2)+'pt');x.g.style.setProperty('--gap',gap.toFixed(2)+'pt');
 });
 area.querySelectorAll('.person-name').forEach(el=>{
  el.classList.remove('wrap');el.style.fontSize='';
  let f=parseFloat(getComputedStyle(el).fontSize);const min=4.4*PX;
  while(el.scrollWidth>el.clientWidth+.5&&f>min){f-=.25;el.style.fontSize=f+'px';}
  if(el.scrollWidth>el.clientWidth+.5)el.classList.add('wrap');
 });

/* ---------- programme pages ---------- */
/* Shading is decided per TIME GROUP (consecutive rows sharing the same time block), not per <tr>.
   Group 1 = shaded, group 2 = plain, group 3 = shaded … Reminder strips are skipped and never advance the counter.
   The merged TIME cell receives the same class as its group's activity and venue cells. */
function programmeRowsHTML(rows){
 let html='',g=0;
 for(let i=0;i<rows.length;){
  const row=rows[i];
  if(row.type==='note'){html+=`<tr class="note-tr"><td colspan="3" class="note-row">${esc(row.activity||'')}</td></tr>`;i++;continue;}
  const time=row.time||'';let j=i+1;
  while(j<rows.length&&rows[j].type!=='note'&&(rows[j].time||'')===time)j++;
  const span=j-i,cls=g%2===0?'fill':'plain';
  for(let k=i;k<j;k++){
   const r=rows[k];
   html+=`<tr data-group="${g}">`;
   if(k===i)html+=`<td class="time-cell ${cls}" rowspan="${span}">${esc(time)}</td>`;
   html+=`<td class="${cls}">${esc(r.activity||'')}</td><td class="${cls}">${esc(r.venue||'')}</td></tr>`;
  }
  g++;i=j;
 }
 return html;
}
function programmePage(day,di){
 const label=day.label||`DAY-${di+1}`;
 return `<section class="print-page programme-page">
  <h2 class="abs ph-title">PROGRAMME SCHEDULE</h2><div class="abs ph-rule"></div>
  <div class="abs ph-sub">${esc(state.campaign.programmeName)}<br>${esc(dateRange())}</div>
  <img class="abs ph-logo" src="${LOGO}" alt="">
  <div class="abs ph-double"></div>
  <div class="abs day-ribbon"><span class="d1">${esc(label)}</span><span class="bar">|</span><span class="d2">${esc(dateForDay(di))}</span></div>
  <div class="abs sched-wrap"><table class="schedule-table"><colgroup><col class="time"><col class="activity"><col class="venue"></colgroup><thead><tr><th>TIME</th><th>ACTIVITY</th><th>VENUE</th></tr></thead><tbody>${programmeRowsHTML(day.rows||[])}</tbody></table></div>
  <div class="abs page-bar"></div>
 </section>`;
}
/* Original rows are 28.6pt; if a day has so many rows that the table would run into the bottom bar, compress evenly. */
function fitProgramme(){
 const PX=96/72,LIMIT=800;
 $$('.programme-page').forEach(p=>{
  const wrap=$('.sched-wrap',p),tbl=$('.schedule-table',p);
  tbl.style.removeProperty('--row-h');tbl.style.removeProperty('--row-pad');tbl.style.removeProperty('--row-fs');tbl.style.removeProperty('--note-h');
  const bottom=()=>(wrap.offsetTop+tbl.offsetHeight)/PX;
  let h=30.4,pad=7.4,fs=12,nh=21.7,guard=0;
  while(bottom()>LIMIT&&guard++<40){
   h=Math.max(14,h-.8);pad=Math.max(1.5,pad-.2);if(h<22){fs=Math.max(8.5,fs-.15);nh=Math.max(14,nh-.3);}
   tbl.style.setProperty('--row-h',h+'pt');tbl.style.setProperty('--row-pad',pad+'pt');tbl.style.setProperty('--row-fs',fs+'pt');tbl.style.setProperty('--note-h',nh+'pt');
  }
 });
}

/* ---------- tracker page ---------- */
function trackerHTML(){
 const t=state.tracker,L=trackerLayout(),days=L.days,cols=t.columns,wl=t.weekLen;
 const colgroup=`<colgroup><col style="width:${TK.DAYW}pt">${cols.map(c=>`<col style="width:${(c.type==='w'?L.w:L.d).toFixed(3)}pt">`).join('')}</colgroup>`;
 let body='<tbody>',day=days,first=true;
 while(day>=1){
  const span=first?(days%wl||wl):Math.min(wl,day);
  for(let i=0;i<span;i++){
   body+=`<tr><td class="day dn-cell"><span class="dn">${day}</span></td>`;
   cols.forEach(c=>{
    if(c.type==='w'){if(i===0)body+=`<td class="wk" rowspan="${span}"></td>`;}
    else body+='<td></td>';
   });
   body+='</tr>';day--;
  }
  first=false;
 }
 body+='</tbody>';
 const foot=`<tfoot><tr><th class="corner"></th>${cols.map(c=>`<th><div class="vwrap"><div class="vtext ${c.type==='w'?'wkl':''}">${esc(c.label)}</div></div></th>`).join('')}</tr></tfoot>`;
 return `<section class="print-page tracker-page"><div class="abs tk-frame"></div><div class="abs tk-box"></div><div class="abs tk-title"><span>${esc(t.title)}</span></div><table class="tk-table" style="--rowh:${L.rowH.toFixed(3)}pt;--dnfs:${Math.max(5,Math.min(8.4,L.rowH*.55)).toFixed(2)}pt">${colgroup}${body}${foot}</table></section>`;
}
function fitTracker(){
 const page=$('.tracker-page');if(!page)return;
 const PX=96/72;
 $$('.vwrap',page).forEach(w=>{
  const el=w.firstElementChild;el.style.fontSize='';
  let f=parseFloat(getComputedStyle(el).fontSize)/PX;
  const cell=w.parentElement,cw=cell.clientWidth-2,ch=cell.clientHeight-4*PX;
  el.style.maxHeight=ch+'px';
  let guard=0;
  while((el.offsetWidth>cw||el.scrollHeight>ch+1)&&f>4.2&&guard++<60){f-=.2;el.style.fontSize=f+'pt';}
 });
 const span=$('.tk-title span',page);
 if(span){span.style.setProperty('--tsx','1');
  const natural=span.getBoundingClientRect().height/PX; // rotated: height = text length (pt)
  const target=627.5,maxLen=640;
  const sx=Math.min(1.263,maxLen/Math.max(1,natural));
  span.style.setProperty('--tsx',sx.toFixed(4));
  void target;
 }
}


/* ---------- day pages follow the start / end dates ---------- */
const MAX_CAMP_DAYS=14;
function campDayCount(){
 const s=new Date((state.campaign.startDate||'')+'T12:00:00'),e=new Date((state.campaign.endDate||state.campaign.startDate||'')+'T12:00:00');
 if(isNaN(s.getTime())||isNaN(e.getTime()))return state.days.length;
 return Math.max(1,Math.min(MAX_CAMP_DAYS,Math.round((e-s)/86400000)+1));
}
function syncDays(){
 const n=campDayCount();state.stash=state.stash||[];
 while(state.days.length>n)state.stash.unshift(state.days.pop());          // keep removed days so nothing is lost
 while(state.days.length<n)state.days.push(state.stash.length?state.stash.shift():{label:'',rows:[{time:'',activity:'New activity',venue:''}]});
 state.days.forEach((d,i)=>{d.label=`DAY-${i+1}`;d.rows=d.rows||[];});
 const c=state.campaign;
 if(/^\s*\d+\s*DAYS?\s*CAMP\s*$/i.test(c.campType||''))c.campType=`${n} ${n===1?'DAY':'DAYS'} CAMP`;
 if(/\b\d+\s*Days?\b/i.test(c.programmeName||''))c.programmeName=c.programmeName.replace(/\b\d+\s*Days?\b/i,`${n} ${n===1?'Day':'Days'}`);
}

/* ---------- render ---------- */
function applyTheme(){
 $('#printPages').dataset.theme=state.theme;
 document.documentElement.dataset.theme=state.theme;
 renderThemeBar();
}
function updatePreviewWarning(){
 const w=trackerWarnings(),el=$('#previewWarn');
 if(w.length){el.hidden=false;el.innerHTML='<strong>Weekly tracker (page 6):</strong> '+w.map(esc).join(' ');}else{el.hidden=true;el.innerHTML='';}

function renderPreview(){
 const ps=$('#pageSummary');if(ps)ps.textContent=`${state.days.length+2} pages: poster, ${state.days.length} daily programme${state.days.length===1?'':'s'} and tracker.`;
 const pages=[posterHTML(),...state.days.map((d,i)=>programmePage(d,i)),trackerHTML()];
 $('#printPages').innerHTML=pages.join('');
 applyTheme();
 fitAll();
 applyZoom();
 renderChips();
 updatePreviewWarning();
}
function fitAll(){
 const pp=$('#printPages'),z=pp.style.zoom;pp.style.zoom='1';
 try{fitPoster();fitProgramme();fitTracker();}finally{pp.style.zoom=z;}
}
const PAGE_PX=210/25.4*96;
function applyZoom(){
 const v=$('#zoomSel').value,pp=$('#printPages');
 let z=1;
 if(v==='fit'){const avail=$('.preview-wrap').clientWidth-24;z=Math.max(.3,Math.min(1,avail/PAGE_PX));}
 else z=parseFloat(v)||1;
 pp.style.zoom=String(z);
}
function renderChips(){
 const names=['Poster',...state.days.map((d,i)=>`Day ${i+1}`),'Tracker'];
 $('#pageChips').innerHTML=names.map((n,i)=>`<button type="button" class="chip" data-page="${i}">${esc(n)}</button>`).join('');
}
function refresh(){renderEditor();renderPreview();}
function refreshTrackerLive(){
 renderPreview();
 const info=$('#trackerInfo');if(info)info.innerHTML=trackerInfoText();
 const w=trackerWarnings(),el=$('#trackerWarn');if(el){el.hidden=!w.length;el.innerHTML=w.map(esc).join('<br>');}
}
function updateFromInput(e){
 const t=e.target;if(!t.dataset.path)return;
 let value=t.value;
 if(t.dataset.path==='rowMode'){setPath('rowMode',value==='balanced'?'balanced':'fill');refresh();return;}
 if(t.dataset.path==='campaign.startDate'||t.dataset.path==='campaign.endDate'){setPath(t.dataset.path,value);syncDays();renderPreview();return;}
 if(t.dataset.path==='tracker.days'){setPath(t.dataset.path,clampDays(value));refreshTrackerLive();return;}
 if(t.dataset.path==='tracker.weekLen'){setPath(t.dataset.path,Math.max(2,Math.min(14,parseInt(value,10)||7)));refreshTrackerLive();return;}
 setPath(t.dataset.path,value);
 if(t.dataset.path.startsWith('tracker.')){refreshTrackerLive();return;}
 renderPreview();
}
$('#editorBody').addEventListener('input',e=>{if(e.target.type==='file')return;updateFromInput(e);});
$('#editorBody').addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.bulk){
  const files=Array.from(t.files||[]).filter(f=>f.type.startsWith('image/')).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'}));
  if(!files.length)return;
  if(!confirm(`Replace the current ${t.dataset.bulk==='mentors'?'mentor / speaker':'team'} list with ${files.length} selected photos? Names will be taken from the file names.`)){t.value='';return;}
  Promise.all(files.map(file=>new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve({name:file.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').trim(),photo:reader.result});reader.onerror=reject;reader.readAsDataURL(file);}))).then(records=>{state[t.dataset.bulk]=records;refresh();}).catch(err=>alert('Could not read one of the images: '+err.message));
  return;
 }
 if(t.dataset.photo){const file=t.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{setPath(t.dataset.photo,reader.result);refresh();};reader.readAsDataURL(file);return;}
 updateFromInput(e);
});
$('#editorBody').addEventListener('click',e=>{
 const b=e.target.closest('[data-action]');if(!b||b.disabled)return;
 const a=b.dataset.action,T=state.tracker;
 if(a==='add-person'){state[b.dataset.list].push({name:'New person',photo:''});refresh();}
 if(a==='remove-person'){state[b.dataset.list].splice(+b.dataset.index,1);refresh();}
 if(a==='remove-row'){state.days[+b.dataset.day].rows.splice(+b.dataset.row,1);refresh();}
 if(a==='add-row'){state.days[+b.dataset.day].rows.push({time:'',activity:'New activity',venue:''});refresh();}
 if(a==='add-note'){state.days[+b.dataset.day].rows.push({type:'note',activity:'Add reminder text'});refresh();}
 /* tracker rows */
 if(a==='days-plus'){T.days=clampDays(T.days+1);refresh();}
 if(a==='days-minus'){T.days=clampDays(T.days-1);refresh();}
 if(a==='days-set'){T.days=clampDays(+b.dataset.n);refresh();}
 /* tracker columns */
 if(a==='add-daily'&&T.columns.length<MAX_COLS){
  const at=T.columns.map(c=>c.type).lastIndexOf('d');
  T.columns.splice(at+1,0,{id:uid(),label:`New habit ${T.columns.filter(c=>c.type!=='w').length+1}`,type:'d'});refresh();}
 if(a==='add-weekly'&&T.columns.length<MAX_COLS){T.columns.push({id:uid(),label:'New weekly reflection',type:'w'});refresh();}
 if(a==='col-remove'){T.columns.splice(+b.dataset.i,1);refresh();}
 if(a==='col-up'){const i=+b.dataset.i;if(i>0){[T.columns[i-1],T.columns[i]]=[T.columns[i],T.columns[i-1]];refresh();}}
 if(a==='col-down'){const i=+b.dataset.i;if(i<T.columns.length-1){[T.columns[i+1],T.columns[i]]=[T.columns[i],T.columns[i+1]];refresh();}}
 if(a==='tracker-reset'){if(confirm('Restore the original tracker (31 days, 11 daily habit columns, 1 weekly reflection column)?')){state.tracker={title:'Weekly Health Tracking Tool',days:31,weekLen:7,columns:defaultColumns()};refresh();}}
});
$('#themeBar').addEventListener('click',e=>{const b=e.target.closest('[data-theme]');if(!b)return;state.theme=b.dataset.theme;applyTheme();});
$('#themeTrigger').addEventListener('click',e=>{e.stopPropagation();const p=$('#themeBar');p.hidden=!p.hidden;$('#themeTrigger').setAttribute('aria-expanded',String(!p.hidden));});
document.addEventListener('click',e=>{const p=$('#themeBar');if(!p.hidden&&!e.target.closest('.theme-pop')){p.hidden=true;$('#themeTrigger').setAttribute('aria-expanded','false');}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#themeBar').hidden=true;}});
$('#pageChips').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(!b)return;const pg=$$('.print-page')[+b.dataset.page];if(pg)pg.scrollIntoView({behavior:'smooth',block:'start'});});
$('#zoomSel').addEventListener('change',applyZoom);
window.addEventListener('resize',()=>{if($('#zoomSel').value==='fit')applyZoom();});
$('#editorBody').addEventListener('toggle',e=>{const d=e.target.closest&&e.target.closest('details.day-edit');if(d){d.open?openDays.add(+d.dataset.day):openDays.delete(+d.dataset.day);}},true);
$('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;activeTab=b.dataset.tab;$$('.tab').forEach(x=>x.classList.toggle('active',x===b));renderEditor();});
function resetTabs(){activeTab='details';$$('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab==='details'));}
$('#resetSample').addEventListener('click',()=>{if(confirm('Load the sample information from the supplied PDF? Current unsaved edits will be replaced.')){state=normalizeState(clone(sample));resetTabs();refresh();}});
$('#exportProject').addEventListener('click',()=>{
 const blob=new Blob([JSON.stringify({format:'NLS-Campaign-Scheduler',version:2,state},null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='NLS_Campaign_Project.json';a.click();URL.revokeObjectURL(url);
});
$('#importProject').addEventListener('click',()=>$('#projectFile').click());
$('#projectFile').addEventListener('change',e=>{
 const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const obj=JSON.parse(r.result);const s=obj.state||obj;if(!s.campaign||!s.days)throw new Error('This file is not a campaign project.');state=normalizeState(s);resetTabs();refresh();}catch(err){alert('Could not open this project: '+err.message);}};r.readAsText(f);e.target.value='';
});
$('#printPdf').addEventListener('click',()=>{
 const missing=[...state.mainSpeakers,...state.mentors,...state.team].filter(p=>!p.photo).length;
 if(missing>0 && !confirm(`${missing} portrait(s) do not have a photo. Blank photo placeholders will appear. Generate the PDF anyway?`))return;
 const w=trackerWarnings();
 if(w.length && !confirm('Weekly tracker notice:\n\n'+w.join('\n')+'\n\nPrint anyway?'))return;
 fitAll();window.print();
});
window.addEventListener('beforeprint',fitAll);
state=normalizeState(state);
renderEditor();renderPreview();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>fitAll());
</script>
